name: Validate governed CSO partnership pack

on:
  pull_request:
    paths:
      - 'docs/standards/governance/cso-partnerships/**'
      - 'schemas/governance/cso-partnerships/**'
      - 'examples/governance/cso-partnerships/**'
      - 'scripts/validate_cso_partnership_examples.py'
      - '.github/workflows/validate-cso-governance.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/standards/governance/cso-partnerships/**'
      - 'schemas/governance/cso-partnerships/**'
      - 'examples/governance/cso-partnerships/**'
      - 'scripts/validate_cso_partnership_examples.py'
      - '.github/workflows/validate-cso-governance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema PyYAML

      - name: Validate governed CSO partnership pack
        run: python scripts/validate_cso_partnership_examples.py
