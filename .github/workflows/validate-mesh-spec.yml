name: validate-mesh-spec

on:
  pull_request:
    paths:
      - 'docs/standards/agentic-local-first-fog-mesh/**'
      - '.github/workflows/validate-mesh-spec.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/standards/agentic-local-first-fog-mesh/**'
      - '.github/workflows/validate-mesh-spec.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Run mesh spec validator
        run: python docs/standards/agentic-local-first-fog-mesh/validate_mesh_spec_ci.py
